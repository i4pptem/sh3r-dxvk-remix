name: SH3R Runtime Build

on:
  push:
    branches: [main, 'release/**', 'release-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sh3r-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    name: Release Runtime and x86 bridge
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      BUILD_SENTRY_ENVIRONMENT: sh3r-github-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Setup build tools
        run: |
          python -m pip install meson==1.8.2 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GITHUB_SHA_SHORT=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_ENV

      - name: Test SH3 UI and injection policies
        run: |
          . .\build_common.ps1
          PerformBuild -BuildFlavour release -BuildSubDir _Comp64UnitTest -Backend ninja -EnableTracy false -ConfigureOnly $true -SkipApics $true
          meson compile -C _Comp64UnitTest test_rasterized_ui_policy test_rtx_injection_state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson test -C _Comp64UnitTest --no-rebuild --print-errorlogs test_rasterized_ui_policy test_rtx_injection_state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 Runtime
        run: |
          . .\build_common.ps1
          PerformBuild -BuildFlavour release -BuildSubDir _Comp64Release -Backend ninja -EnableTracy false -ConfigureOnly $true -SkipApics $true
          meson compile -C _Comp64Release -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson install -C _Comp64Release --no-rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build matching bridge
        working-directory: bridge
        run: |
          .\build_bridge_release.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Runtime and bridge for Silent Hill 3
        run: |
          $packageDirectory = Join-Path $PWD '_package'
          $runtimeDirectory = Join-Path $packageDirectory '.trex'
          New-Item -ItemType Directory -Path $runtimeDirectory -Force | Out-Null
          Copy-Item -Path '_output/*.dll' -Destination $runtimeDirectory
          Copy-Item -LiteralPath '_output/usd' -Destination $runtimeDirectory -Recurse
          $bridgeFiles = Get-ChildItem -LiteralPath 'bridge/_output' -Recurse -File -Force | Where-Object Extension -in '.dll', '.exe'
          foreach ($bridgeFile in $bridgeFiles) {
            $bridgeRelativePath = [IO.Path]::GetRelativePath((Join-Path $PWD 'bridge/_output'), $bridgeFile.FullName)
            $bridgeDestination = Join-Path $packageDirectory $bridgeRelativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $bridgeDestination) -Force | Out-Null
            Copy-Item -LiteralPath $bridgeFile.FullName -Destination $bridgeDestination
          }
          Copy-Item -LiteralPath 'LICENSE', 'LICENSE-MIT', 'ThirdPartyLicenses.txt', 'documentation/sh3r/ACTIONS.md' -Destination $packageDirectory
          foreach ($requiredFile in @('d3d9.dll', '.trex/d3d9.dll', '.trex/NvRemixBridge.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDirectory $requiredFile))) {
              throw "Missing package component: $requiredFile"
            }
          }

      - name: Upload Runtime and bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sh3r-dxvk-remix-${{ env.GITHUB_SHA_SHORT }}-release-x86-game
          path: _package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload debugging symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sh3r-dxvk-remix-${{ env.GITHUB_SHA_SHORT }}-symbols
          path: |
            _output/*.pdb
            bridge/_output/**/*.pdb
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build and test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sh3r-build-logs-${{ github.run_number }}
          path: |
            _Comp64Release/meson-logs/
            _Comp64UnitTest/meson-logs/
            bridge/_compRelease_x64/meson-logs/
            bridge/_compRelease_x86/meson-logs/
            update-deps.log
            bridge/update-deps.log
          if-no-files-found: ignore
          retention-days: 14
